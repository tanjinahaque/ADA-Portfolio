<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>placeholder — Tanjina Haque</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="homepage.css" />
  <link rel="stylesheet" href="child-pages.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
</head>
<body class="auth-locked placeholder-page">
  <!-- Password Gate -->
  <div class="password-gate" id="password-gate" role="dialog" aria-labelledby="password-heading" aria-describedby="password-help" aria-modal="true">
    <form class="password-card" id="password-form">
      <p class="password-kicker">Private Portfolio</p>
      <h2 id="password-heading">Enter Password</h2>
      <p id="password-help">Please enter the password to view Tanjina Haque's case study.</p>
      <div class="password-field">
        <label for="portfolio-password">Password</label>
        <div class="password-input-wrap">
          <input type="password" id="portfolio-password" name="portfolio-password" autocomplete="current-password" required />
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>
      <p class="password-error" id="password-error" role="alert" hidden>Incorrect password. Please try again.</p>
      <button type="submit" class="btn btn-primary">Unlock Case Study</button>
    </form>
  </div>

  <noscript>
    <div class="password-noscript">
      JavaScript is required to unlock this case study.
    </div>
  </noscript>

  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header>
    <nav class="placeholder-nav" aria-label="Primary navigation">
      <a href="index.html#hero" class="brand" aria-label="Tanjina Haque — Home"><span class="monogram" aria-hidden="true">T<span>H</span></span><span class="brand-copy"><strong>Tanjina Haque</strong><span>UX · Accessibility · Strategy</span></span></a>
      <a href="index.html#all-projects" class="btn btn-outline">Back to Work</a>
    </nav>
  </header>
  <main id="main-content" class="placeholder-content">
    <h1>placeholder</h1>
  </main>
  <footer><div class="container"><p>&copy; <span id="year"></span> Tanjina Haque</p></div></footer>
  <script>
    // Password protection
    const PORTFOLIO_PASSWORD = 'portfolio2026';
    const AUTH_STORAGE_KEY = 'portfolioUnlocked';
    const passwordGate = document.getElementById('password-gate');
    const passwordForm = document.getElementById('password-form');
    const passwordInput = document.getElementById('portfolio-password');
    const passwordError = document.getElementById('password-error');
    const passwordToggle = document.getElementById('password-toggle');

    function unlockPortfolio() {
      document.body.classList.remove('auth-locked');
      passwordGate.hidden = true;
      sessionStorage.setItem(AUTH_STORAGE_KEY, 'true');
    }

    if (sessionStorage.getItem(AUTH_STORAGE_KEY) === 'true') {
      unlockPortfolio();
    } else {
      passwordInput.focus();
    }

    passwordForm.addEventListener('submit', event => {
      event.preventDefault();
      if (passwordInput.value === PORTFOLIO_PASSWORD) {
        unlockPortfolio();
        const mainContent = document.getElementById('main-content');
        mainContent.setAttribute('tabindex', '-1');
        mainContent.focus();
        return;
      }

      passwordError.hidden = false;
      passwordInput.value = '';
      passwordInput.focus();
    });

    passwordToggle.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'text';
      passwordInput.type = isVisible ? 'password' : 'text';
      passwordToggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
      passwordToggle.setAttribute('aria-pressed', String(!isVisible));
      passwordToggle.textContent = isVisible ? 'Show' : 'Hide';
    });

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
